# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Require tag commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify, build, vet, and test
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go build ./...
          go vet ./...
          go test -race ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Validate image and Compose
        run: |
          docker build -t voicy:release-check .
          cp .env.example .env
          docker compose config >/dev/null
          cp .env.example deploy/ws04/.env
          VOICY_IMAGE=ghcr.io/freshlabdev/voicy:test docker compose -f deploy/ws04/compose.yaml config >/dev/null

  release:
    name: Publish image and prerelease
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Resolve build metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME}" >>"$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"
          if printf '%s' "${GITHUB_REF_NAME}" | grep -q '-'; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Lowercase image name
        id: image
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
      - name: Extract changelog section
        id: changelog
        run: |
          notes_file="$(mktemp)"
          awk -v ver="## ${GITHUB_REF_NAME}" '
            index($0, ver) == 1 && (length($0) == length(ver) || substr($0, length(ver) + 1, 1) == " ") { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md >"${notes_file}"
          if [ ! -s "${notes_file}" ]; then
            echo "CHANGELOG.md has no ${GITHUB_REF_NAME} section" >&2
            exit 1
          fi
          echo "file=${notes_file}" >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.repo }}:${{ steps.meta.outputs.version }}
            ${{ steps.image.outputs.repo }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
      - name: Record immutable image
        env:
          IMAGE: ${{ steps.image.outputs.repo }}
          DIGEST: ${{ steps.build.outputs.digest }}
          NOTES_FILE: ${{ steps.changelog.outputs.file }}
        run: |
          printf "\n### Container image\n\n\`%s@%s\`\n" "$IMAGE" "$DIGEST" >>"$NOTES_FILE"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
              gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${{ steps.changelog.outputs.file }}" --prerelease
            else
              gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${{ steps.changelog.outputs.file }}"
            fi
          else
            if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
              gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${{ steps.changelog.outputs.file }}" --prerelease
            else
              gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${{ steps.changelog.outputs.file }}"
            fi
          fi
