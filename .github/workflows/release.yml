# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tag on the branch its channel is published from
        # docs/versioning.md: pre-releases are tagged on dev, stable releases on
        # main. A stable tag that never went through main would publish
        # something the production branch has not seen.
        run: |
          if printf '%s' "${GITHUB_REF_NAME}" | grep -Eq -- '-(alpha|beta|rc)\.'; then
            branch=dev
          else
            branch=main
          fi
          git fetch --no-tags origin "${branch}:refs/remotes/origin/${branch}"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${branch}"; then
            echo "tag ${GITHUB_REF_NAME} is not an ancestor of origin/${branch}"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify, build, vet, and test
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go build ./...
          go vet ./...
          go test -race ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Validate image and Compose
        run: |
          docker build -t voicy:release-check .
          cp .env.example .env
          docker compose config >/dev/null
          cp .env.example deploy/ws04/.env
          VOICY_IMAGE=ghcr.io/freshlabdev/voicy:test \
            TELEGRAM_BOT_TOKEN=000:ci-validation-only \
            BOT_API_HOST_DIR=/opt/stacks/telegram-bot-api/files \
            docker compose -f deploy/ws04/compose.yaml config >/dev/null

  database:
    name: Verify database behavior
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voicy
          POSTGRES_PASSWORD: voicy
          POSTGRES_DB: voicy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voicy -d voicy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run database tests
        env:
          VOICY_TEST_DATABASE_URL: postgres://voicy:voicy@localhost:5432/voicy_test?sslmode=disable
        run: go test -tags=integration -race ./internal/db/

  release:
    name: Publish image and prerelease
    needs: [verify, database]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve build metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME}" >>"$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"
          if printf '%s' "${GITHUB_REF_NAME}" | grep -q '-'; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Lowercase image name
        id: image
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
      - name: Extract changelog section
        id: changelog
        run: |
          notes_file="$(mktemp)"
          awk -v ver="## ${GITHUB_REF_NAME}" '
            index($0, ver) == 1 && (length($0) == length(ver) || substr($0, length(ver) + 1, 1) == " ") { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md >"${notes_file}"
          if [ ! -s "${notes_file}" ]; then
            echo "CHANGELOG.md has no ${GITHUB_REF_NAME} section" >&2
            exit 1
          fi
          echo "file=${notes_file}" >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.repo }}:${{ steps.meta.outputs.version }}
            ${{ steps.image.outputs.repo }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
      - name: Record immutable image
        env:
          IMAGE: ${{ steps.image.outputs.repo }}
          DIGEST: ${{ steps.build.outputs.digest }}
          NOTES_FILE: ${{ steps.changelog.outputs.file }}
        run: |
          printf "\n### Container image\n\n\`%s@%s\`\n" "$IMAGE" "$DIGEST" >>"$NOTES_FILE"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
              gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${{ steps.changelog.outputs.file }}" --prerelease
            else
              gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${{ steps.changelog.outputs.file }}"
            fi
          else
            if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
              gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${{ steps.changelog.outputs.file }}" --prerelease
            else
              gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${{ steps.changelog.outputs.file }}"
            fi
          fi
