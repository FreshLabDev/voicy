# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  database:
    name: Database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voicy
          POSTGRES_PASSWORD: voicy
          POSTGRES_DB: voicy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voicy -d voicy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run database tests
        env:
          VOICY_TEST_DATABASE_URL: postgres://voicy:voicy@localhost:5432/voicy_test?sslmode=disable
        run: go test -tags=integration -race ./internal/db/

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  image:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build image
        run: docker build -t voicy:ci .
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          cp .env.example deploy/ws04/.env
          # The production stack mounts this bot's own directory on the shared
          # Bot API server, and that path is the token, so validation needs a
          # value to interpolate.
          VOICY_IMAGE=ghcr.io/freshlabdev/voicy:test \
            TELEGRAM_BOT_TOKEN=000:ci-validation-only \
            docker compose -f deploy/ws04/compose.yaml config >/dev/null
