# Production stack on WS04. Joins shared core_net / core-postgres.
name: voicy

services:
  bot:
    image: ${VOICY_IMAGE:?VOICY_IMAGE must be an immutable GHCR reference}
    container_name: voicy-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      MIGRATIONS_DIR: /app/migrations
      HTTP_ADDR: :8080
      AUTO_MIGRATE: "true"
    networks: [core_net]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

networks:
  core_net:
    external: true
    name: core_net
