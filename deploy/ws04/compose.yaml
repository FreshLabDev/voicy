# Production stack on WS04. Joins shared core_net / core-postgres.
name: voicy

services:
  bot:
    image: ${VOICY_IMAGE:?VOICY_IMAGE must be an immutable GHCR reference}
    container_name: voicy-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      MIGRATIONS_DIR: /app/migrations
      HTTP_ADDR: :8080
      AUTO_MIGRATE: "true"
    # telegram_bot_api_net reaches the shared self-hosted Bot API server, the
    # same one vido uses. The bind mount is that server's data directory: with
    # TELEGRAM_LOCAL it answers getFile with an absolute path there, which is
    # how media above the cloud API's 20 MB ceiling is read. It is writable so
    # Voicy can delete a file after transcribing it; the local server never
    # cleans them up on its own.
    networks: [core_net, telegram_bot_api_net]
    volumes:
      - /opt/stacks/telegram-bot-api/data:/var/lib/telegram-bot-api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

networks:
  core_net:
    external: true
    name: core_net
  telegram_bot_api_net:
    external: true
    name: telegram_bot_api_net
